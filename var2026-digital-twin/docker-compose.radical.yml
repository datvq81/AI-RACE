services:
  radical_gs:
    build:
      context: .
      dockerfile: Dockerfile.radical
    container_name: var2026_radical_gs
    working_dir: /workspace
    volumes:
      - .:/workspace
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stdin_open: true
    tty: true
